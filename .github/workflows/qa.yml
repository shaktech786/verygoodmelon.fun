name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    name: Typecheck, Lint, Build & E2E
    runs-on: ubuntu-latest

    env:
      GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY || '' }}
      # Production has a URL whose host may be unreachable; an unresolvable placeholder
      # reproduces that instead of the different 'not configured' code path.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.invalid' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Design rules (flesh only for actions, no new design debt)
        run: npm run check:design

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run unit tests
        run: npm test

      - name: Run accessibility tests
        run: npm run test:a11y

      - name: Run E2E tests
        run: npx playwright test __tests__/e2e --project=chromium
