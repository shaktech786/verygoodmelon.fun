<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1792" viewBox="0 0 1024 1792" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1792" fill="#f5e6d3" rx="64"/>

  <!-- Inner card area -->
  <rect x="64" y="64" width="896" height="1664" fill="#f6ad55" rx="48"/>

  <!-- Decorative border (pixelated) -->
  <rect x="96" y="96" width="32" height="32" fill="#1a4d2e"/>
  <rect x="96" y="1664" width="32" height="32" fill="#1a4d2e"/>
  <rect x="896" y="96" width="32" height="32" fill="#1a4d2e"/>
  <rect x="896" y="1664" width="32" height="32" fill="#1a4d2e"/>

  <!-- Title banner -->
  <rect x="128" y="160" width="768" height="160" fill="#ffffff" rx="16"/>
  <text x="512" y="260"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="72"
    font-weight="800"
    fill="#1a1a1a"
    text-anchor="middle"
    letter-spacing="-2">THE KEEPER</text>

  <!-- Icon area (pixelated) - a sealed jar keeping one folded worry -->
  <g transform="translate(192, 708) scale(8)" shape-rendering="crispEdges">
    <circle cx="40" cy="42" r="34" fill="#ffd8a0" shape-rendering="auto"/>
    <rect x="18" y="66" width="44" height="2" fill="#1a1a1a" opacity="0.18"/>

    <!-- Glass -->
    <path d="M26 24 H54 V26 H57 V28 H59 V62 H57 V64 H55 V66 H25 V64 H23 V62 H21 V28 H23 V26 H26 Z"
      fill="#ffffff" fill-opacity="0.45" stroke="#1a1a1a" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="25" y="31" width="2" height="16" fill="#ffffff"/>
    <rect x="25" y="50" width="2" height="4" fill="#ffffff"/>

    <!-- Folded slip -->
    <rect x="31" y="42" width="18" height="18" fill="#fdf1e2"/>
    <rect x="31" y="50" width="18" height="1" fill="#1a1a1a" opacity="0.2"/>
    <rect x="34" y="45" width="11" height="1" fill="#1a1a1a" opacity="0.45"/>
    <rect x="34" y="54" width="9" height="1" fill="#1a1a1a" opacity="0.45"/>
    <rect x="34" y="57" width="12" height="1" fill="#1a1a1a" opacity="0.45"/>

    <!-- Rind lid -->
    <rect x="34" y="11" width="12" height="4" fill="#1a4d2e"/>
    <rect x="22" y="15" width="36" height="7" fill="#1a4d2e"/>
    <rect x="22" y="20" width="36" height="2" fill="#74c69d"/>
    <rect x="24" y="16" width="4" height="2" fill="#74c69d" opacity="0.7"/>
    <rect x="32" y="16" width="4" height="2" fill="#74c69d" opacity="0.7"/>
    <rect x="40" y="16" width="4" height="2" fill="#74c69d" opacity="0.7"/>
    <rect x="48" y="16" width="4" height="2" fill="#74c69d" opacity="0.7"/>

    <!-- Wax seal with a seed -->
    <circle cx="40" cy="25" r="6" fill="#e63946" shape-rendering="auto"/>
    <circle cx="40" cy="25" r="4" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1" shape-rendering="auto"/>
    <ellipse cx="40" cy="25" rx="1.3" ry="2" fill="#1a1a1a" shape-rendering="auto"/>
  </g>

  <!-- Bottom accent -->
  <rect x="196" y="1536" width="632" height="96" fill="#1a4d2e" rx="48"/>
</svg>
