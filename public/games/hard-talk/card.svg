<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1792" viewBox="0 0 1024 1792" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - warm parchment -->
  <rect width="1024" height="1792" fill="#f5e6d3" rx="64"/>

  <!-- Inner card area - evening blue, the hush before a conversation -->
  <rect x="64" y="64" width="896" height="1664" fill="#8fb8c9" rx="48"/>

  <!-- Decorative border corners (pixelated) -->
  <rect x="96" y="96" width="32" height="32" fill="#1a4d2e"/>
  <rect x="96" y="1664" width="32" height="32" fill="#1a4d2e"/>
  <rect x="896" y="96" width="32" height="32" fill="#1a4d2e"/>
  <rect x="896" y="1664" width="32" height="32" fill="#1a4d2e"/>

  <!-- Title banner -->
  <rect x="128" y="160" width="768" height="160" fill="#ffffff" rx="16"/>
  <text x="512" y="260"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="60"
    font-weight="800"
    fill="#1a1a1a"
    text-anchor="middle"
    letter-spacing="-2">THE ENVOY</text>

  <!-- Floor -->
  <rect x="160" y="1240" width="704" height="16" fill="#1a4d2e" opacity="0.35"/>

  <!-- Light spilling from the doorway -->
  <path d="M560 1256 L800 1256 L840 1420 L360 1420 Z" fill="#ffe8c2" opacity="0.6"/>

  <!-- Doorway and warm light -->
  <rect x="560" y="640" width="240" height="600" fill="#f6ad55"/>
  <rect x="592" y="672" width="176" height="568" fill="#ffe8c2" opacity="0.7"/>

  <!-- Door, swung open on its right hinge -->
  <rect x="736" y="640" width="64" height="600" fill="#1a4d2e"/>
  <rect x="748" y="672" width="40" height="536" fill="#74c69d" opacity="0.6"/>
  <rect x="742" y="930" width="12" height="28" fill="#1a1a1a"/>

  <!-- Door frame -->
  <rect x="528" y="608" width="304" height="32" fill="#1a4d2e"/>
  <rect x="528" y="608" width="32" height="648" fill="#1a4d2e"/>
  <rect x="800" y="608" width="32" height="648" fill="#1a4d2e"/>

  <!-- The envoy: a watermelon slice holding a folded note -->
  <g transform="translate(330, 1000)">
    <!-- Legs -->
    <rect x="-44" y="120" width="20" height="120" fill="#1a1a1a"/>
    <rect x="24" y="120" width="20" height="120" fill="#1a1a1a"/>
    <!-- Rind, white rind, flesh -->
    <path d="M-150 0 A150 150 0 0 0 150 0 Z" fill="#1a4d2e"/>
    <path d="M-132 0 A132 132 0 0 0 132 0 Z" fill="#74c69d"/>
    <path d="M-112 0 A112 112 0 0 0 112 0 Z" fill="#e63946"/>
    <!-- Face -->
    <rect x="-56" y="24" width="20" height="26" fill="#1a1a1a"/>
    <rect x="36" y="24" width="20" height="26" fill="#1a1a1a"/>
    <path d="M-30 74 Q0 96 30 74" fill="none" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
    <!-- Seeds -->
    <ellipse cx="-70" cy="78" rx="8" ry="12" fill="#1a1a1a" opacity="0.75"/>
    <ellipse cx="70" cy="78" rx="8" ry="12" fill="#1a1a1a" opacity="0.75"/>
    <ellipse cx="0" cy="122" rx="8" ry="12" fill="#1a1a1a" opacity="0.75"/>
    <!-- Arm and note -->
    <rect x="128" y="56" width="48" height="14" fill="#1a4d2e"/>
    <rect x="168" y="12" width="96" height="76" fill="#ffffff" stroke="#1a1a1a" stroke-width="6"/>
    <rect x="186" y="34" width="60" height="8" fill="#1a1a1a" opacity="0.6"/>
    <rect x="186" y="56" width="40" height="8" fill="#1a1a1a" opacity="0.6"/>
  </g>

  <!-- Bottom accent -->
  <rect x="196" y="1536" width="632" height="96" fill="#1a4d2e" rx="48"/>
</svg>
